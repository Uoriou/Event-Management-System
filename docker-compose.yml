version: '3.9'

services:

  db:
    image: postgres
    container_name: postgres-db
    ports:
      - "5432:5432"
    env_file:
      - .env

  python-backend:
    build: ./python-backend
    ports:
      - "9000:9000"
    volumes:
      - ./python-backend:/app
    depends_on:
      - db
    env_file:
      - .env
  express_backend: 
    build: ./express_backend
    ports:
      - "4000:4000"
    depends_on:
      - python-backend
    volumes:
      - ./express_backend:/app
      - express_backend_node_modules:/app/node_modules

  frontend:
    build: ./etms_app_frontend/frontend
    ports:
      - "3000:3000"
    depends_on:
      - python-backend
    volumes:
      - ./etms_app_frontend/frontend:/app    # The source code is inside froentend folder         
      #- /app/node_modules  
      
volumes:
  express_backend_node_modules: # Added for testing, see if it works
